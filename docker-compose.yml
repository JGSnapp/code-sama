services:
  code-sama-os:
    build: .
    image: code-sama-os:latest
    container_name: code-sama-os
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      # Force Linux broker paths inside the image.
      HOST: "0.0.0.0"
      PORT: "8765"
      WORKSPACE_DIR: "/workspace"
      LINUX_CAPTURE: "ffmpeg"
      BROWSER_HEADLESS: "true"
    volumes:
      # Persistent agent workspace (code she writes, generated manifests).
      - ./workspace:/workspace
      - ./logs:/opt/code-sama/logs
      # Keep auth / UI settings / uploads / VRM across rebuilds.
      - ./settings.json:/opt/code-sama/settings.json
      - ./uploads:/opt/code-sama/uploads
      - ./characters:/opt/code-sama/characters
    shm_size: "1gb"
    # Needed so Xvfb + ffmpeg can talk; keep privileged off if possible.
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
